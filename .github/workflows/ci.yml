# Disposable, fork-only reproduction of bootc-dev/bootc run 34644761085.
name: PR 2454 root-transient reproduction

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LIBVIRT_DEFAULT_URI: qemu:///session
  DEV_IMAGE: ghcr.io/bootc-dev/dev-bootc
  BOOTC_CI_RETRIES: "10"
  BOOTC_CI_DELAY: "60"
  # The original job's stream10 image had this config blob. This immutable
  # amd64 manifest was selected by matching that captured config digest.
  ORIGINAL_BASE_IMAGE: quay.io/centos-bootc/centos-bootc@sha256:6673fbbd49b11314700b0e842ed75149a673eb9faf7ec4cc5882b0978c0d029c
  ORIGINAL_BASE_CONFIG_DIGEST: sha256:a1dd282f8fdf927219a9cfe301dd55e3daabe8b871c1032ac9b9a0ce6b0e3a61
  ORIGINAL_MERGE_SHA: 4dcd26d98138fe285a5b71976c25b62c34bbd1db
  ORIGINAL_HEAD_SHA: 12f03a042b868f40ec850c2496babda1d66775d5
  ORIGINAL_PACKAGE_RUN_ID: "34644761085"

jobs:
  package:
    # This file is intentionally useful only in the disposable diagnostic fork.
    if: github.repository == 'cgwalters-bot/bootc'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.package-source-final.outputs.source_sha }}
      reused: ${{ steps.package-source-final.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify local reproduction source
        run: |
          set -euo pipefail
          # Full checkout history above makes the merge source available for
          # this guard even when Actions checks out the diagnostic branch.
          git diff --exit-code "$ORIGINAL_MERGE_SHA" HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)crates/xtask/src/tmt.rs'
          printf 'Local checkout SHA: %s\n' "$(git rev-parse HEAD)"
          printf 'Original checkout/source SHA: %s\n' "$ORIGINAL_MERGE_SHA"

      - name: Verify original package metadata
        id: upstream-metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The original run API names the PR head, while its checkout log proves
          # it built the merge commit. Both facts guard artifact reuse.
          run=$(gh api "repos/bootc-dev/bootc/actions/runs/${ORIGINAL_PACKAGE_RUN_ID}")
          test "$(jq -r .head_sha <<<"$run")" = "$ORIGINAL_HEAD_SHA"
          test "$(jq -r .head_repository.full_name <<<"$run")" = cgwalters/bootc
          jobs=$(gh api --paginate "repos/bootc-dev/bootc/actions/runs/${ORIGINAL_PACKAGE_RUN_ID}/jobs")
          jq -e '.jobs[] | select(.name == "package (centos-10)" and .conclusion == "success")' \
            <<<"$jobs" >/dev/null
          jq -e '.jobs[] | select(.name == "package (centos-10)") | .steps[] | select(.name == "Unit tests" and .conclusion == "success")' \
            <<<"$jobs" >/dev/null
          artifacts=$(gh api "repos/bootc-dev/bootc/actions/runs/${ORIGINAL_PACKAGE_RUN_ID}/artifacts")
          jq -e '.artifacts[] | select(.name == "packages-centos-10" and .expired == false)' \
            <<<"$artifacts" >/dev/null
          printf 'Original checkout/source SHA: %s\n' "$ORIGINAL_MERGE_SHA"
          printf 'Original run head SHA: %s\n' "$ORIGINAL_HEAD_SHA"
          printf '%s\n' 'Upstream metadata authenticated; attempting artifact reuse.'

      - name: Bootc Ubuntu Setup
        uses: bootc-dev/actions/bootc-ubuntu-setup@347adb4511da29d5d788c38dc80a517155466c67

      - name: Setup CentOS 10 source environment
        run: |
          set -euo pipefail
          echo "BOOTC_base=$ORIGINAL_BASE_IMAGE" >> "$GITHUB_ENV"

      # Public upstream metadata or artifact access can reject the fork's
      # ephemeral token. In either case, build the locally source-guarded code.
      - name: Download original CentOS 10 packages
        id: reuse-packages
        if: steps.upstream-metadata.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: bootc-dev/bootc
          run-id: 34644761085
          name: packages-centos-10
          path: target/packages/

      - name: Build CentOS 10 packages when reuse is unavailable
        if: steps.upstream-metadata.outcome != 'success' || steps.reuse-packages.outcome != 'success'
        run: |
          set -euo pipefail
          if [[ '${{ steps.upstream-metadata.outcome }}' != success ]]; then
            printf '%s\n' 'Upstream metadata was unavailable or unauthenticated; building locally source-validated code.'
          else
            printf '%s\n' 'Upstream artifact download failed; building locally source-validated code.'
          fi
          just check-buildsys

      - name: Unit tests after fresh package build
        if: steps.upstream-metadata.outcome != 'success' || steps.reuse-packages.outcome != 'success'
        run: just unit-tests

      - name: Record package source
        id: package-source-final
        run: |
          set -euo pipefail
          if [[ '${{ steps.upstream-metadata.outcome }}' == success && '${{ steps.reuse-packages.outcome }}' == success ]]; then
            printf 'source_sha=%s\nreused=true\n' "$ORIGINAL_MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'source_sha=%s\nreused=false\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-centos-10
          path: target/packages/*.rpm
          retention-days: 7

  baseconfigs-root-transient:
    if: github.repository == 'cgwalters-bot/bootc'
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record source metadata
        run: |
          set -euo pipefail
          printf 'checkout SHA: %s\n' "$(git rev-parse HEAD)"
          printf 'original checkout/source SHA: %s\n' "$ORIGINAL_MERGE_SHA"
          printf 'original run head SHA: %s\n' "$ORIGINAL_HEAD_SHA"
          printf 'package artifact source SHA: %s (reused: %s)\n' \
            '${{ needs.package.outputs.source_sha }}' '${{ needs.package.outputs.reused }}'
          git diff --exit-code "$ORIGINAL_MERGE_SHA" HEAD -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)crates/xtask/src/tmt.rs'

      - name: Bootc Ubuntu Setup
        uses: bootc-dev/actions/bootc-ubuntu-setup@347adb4511da29d5d788c38dc80a517155466c67
        with:
          libvirt: true

      - name: Install tmt
        uses: ./.github/actions/install-tmt

      - name: Setup original baseconfig environment
        run: |
          set -euo pipefail
          base="$ORIGINAL_BASE_IMAGE"
          {
            echo "BOOTC_base=$base"
            echo 'BOOTC_variant=composefs'
            echo 'BOOTC_baseconfigs=root-transient'
            echo 'RUST_BACKTRACE=full'
          } >> "$GITHUB_ENV"
          # Confirm this immutable amd64 manifest still has the config digest
          # captured in the failing job before Podman can build from it.
          manifest=$(skopeo inspect --raw "docker://$base")
          config_digest=$(jq -r '.config.digest // empty' <<<"$manifest")
          test -n "$config_digest"
          printf 'CentOS 10 base manifest: %s\n' "$base"
          printf 'CentOS 10 base config digest: %s\n' "$config_digest"
          test "$config_digest" = "$ORIGINAL_BASE_CONFIG_DIGEST"

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-centos-10
          path: target/packages/

      - name: Fetch external dependencies (with retry)
        run: BOOTC_SKIP_PACKAGE=1 just build-fetch

      - name: Build container with baseconfig
        run: BOOTC_SKIP_PACKAGE=1 just build

      - name: Build upgrade image
        run: just _build-upgrade-image

      - name: Snapshot host before TMT
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/reproduction-diagnostics"
          install -d -m 700 "$diagnostics"
          {
            printf 'source SHA: '; git rev-parse HEAD
            printf 'package source SHA: %s\n' '${{ needs.package.outputs.source_sha }}'
            printf 'base config digest: %s\n' "$ORIGINAL_BASE_CONFIG_DIGEST"
            printf '%s\n' '--- podman ---'; podman info --format '{{json .Host.Security}}'
            printf '%s\n' '--- libvirt ---'; virsh -c qemu:///session version
            printf '%s\n' '--- disk ---'; df -h
          } > "$diagnostics/pre-tmt.txt"

      - name: Configure restricted Upterm SSH access
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          cat > "$RUNNER_TEMP/upterm-authorized-keys" <<'EOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGMAzoPzAkrzE11BHbdoIDSgXbd2ReF/JWZi5xAKhpFh personal-ai@walters-personal-ai
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQkQHeKan3X+g1jILw4a3KtcfEIED0kByKGWookU7ev
          EOF
          chmod 600 "$RUNNER_TEMP/upterm-authorized-keys"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/upterm-authorized-keys" | wc -l)" -eq 2
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          uptermd.upterm.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICiecex8Dq718eSe1CCLgLvDmI7AagvCtax7brPFWkh4
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
          for variable in XDG_RUNTIME_DIR XDG_CONFIG_HOME XDG_STATE_HOME DBUS_SESSION_BUS_ADDRESS; do
            if [[ -v "$variable" ]]; then
              printf 'export %s=%q\n' "$variable" "${!variable}"
            else
              printf 'unset %s\n' "$variable"
            fi
          done > "$RUNNER_TEMP/upterm-ci-environment.sh"
          chmod 600 "$RUNNER_TEMP/upterm-ci-environment.sh"

      - name: Preflight pinned Upterm relay
        run: |
          set -euo pipefail
          timeout 10s getent ahostsv4 uptermd.upterm.dev >/dev/null
          timeout 10s bash -c ': </dev/tcp/uptermd.upterm.dev/22'
          timeout 10s ssh-keyscan -T 5 -t ed25519 uptermd.upterm.dev 2>/dev/null |
            grep -Fx 'uptermd.upterm.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICiecex8Dq718eSe1CCLgLvDmI7AagvCtax7brPFWkh4'

      - name: Start restricted Upterm session
        id: upterm
        uses: owenthereal/action-upterm@47652056242288ccbebd30f836e9885d09a75365 # v1.15.0
        timeout-minutes: 30
        env:
          UPTERM_AUTHORIZED_KEYS: ${{ runner.temp }}/upterm-authorized-keys
        with:
          upterm-version: v0.26.0
          detached: true
          wait-timeout-minutes: 30

      - name: Validate and publish Upterm SSH address
        env:
          UPTERM_SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          set -euo pipefail
          upterm_tmp=$(node -p 'require("os").tmpdir()')
          shopt -s nullglob
          sockets=("$upterm_tmp"/upterm-data/runtime/upterm/*.sock)
          test "${#sockets[@]}" -eq 1
          session=$(upterm session current --admin-socket "${sockets[0]}")
          for fingerprint in SHA256:jusj7ZW6GCt+aZJxVuTI5cwP2ugciAOkqC/ppjy/Cdc SHA256:6EQswdUrLKN8cHF4bUbT7kQ5qvq2ZEyja/tgrRN1UwY; do
            [[ "$session" == *"$fingerprint"* ]]
          done
          [[ "$UPTERM_SSH_COMMAND" =~ ^ssh[[:space:]]+[^[:space:]]+@uptermd\.upterm\.dev([[:space:]]+-p[[:space:]][0-9]+)?$ ]]
          printf '%s\n' "$UPTERM_SSH_COMMAND" > "$RUNNER_TEMP/upterm-ssh-address"

      - name: Upload Upterm SSH address
        uses: actions/upload-artifact@v7
        with:
          name: upterm-ssh-address-centos-10-root-transient
          path: ${{ runner.temp }}/upterm-ssh-address
          retention-days: 1

      - name: Run original readonly TMT reproduction
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Upterm changes XDG paths for its sockets; restore only the saved,
          # known runner variables before invoking rootless Podman/libvirt.
          source "$RUNNER_TEMP/upterm-ci-environment.sh"
          # This is the TMT invocation expanded from test-tmt-baseconfig. The
          # preceding two steps retain the original image builds so Upterm can
          # start after the image exists and before the boot-chain failure.
          cargo xtask run-tmt \
            --env=BOOTC_variant=composefs \
            --env=BOOTC_baseconfigs=root-transient \
            --upgrade-image=localhost/bootc-upgrade \
            --composefs-backend --bootloader=grub --filesystem=ext4 \
            --seal-state=unsealed --boot-type=bls \
            localhost/bootc readonly --preserve-vm

      - name: Capture preserved VM firmware evidence
        if: always()
        run: |
          set -uo pipefail
          if [[ -f "$RUNNER_TEMP/upterm-ci-environment.sh" ]]; then
            source "$RUNNER_TEMP/upterm-ci-environment.sh"
          fi
          diagnostics="$RUNNER_TEMP/reproduction-diagnostics"
          install -d -m 700 "$diagnostics"
          python3 - "$diagnostics" <<'PY' || printf '%s\n' 'Firmware evidence capture failed unexpectedly.' > "$diagnostics/firmware-capture-error.txt"
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from glob import glob

          output_dir = sys.argv[1]
          uri = "qemu:///session"
          domain_pattern = re.compile(r"^bootc-tmt-[A-Za-z0-9-]+$")

          def command(*args, timeout=10):
              try:
                  result = subprocess.run(args, text=True, capture_output=True, timeout=timeout)
              except Exception as error:
                  return None, str(error)
              if result.returncode:
                  return None, result.stderr.strip()[:1024] or f"exit status {result.returncode}"
              return result.stdout, None

          def element(node):
              if node is None:
                  return None
              value = {"attributes": dict(sorted(node.attrib.items()))}
              if node.text and node.text.strip():
                  value["path"] = node.text.strip()
              return value

          def file_evidence(path, max_size):
              if not path:
                  return None
              evidence = {"path": path, "maximum_bytes": max_size}
              try:
                  info = os.stat(path)
                  evidence["mode"] = format(stat.S_IMODE(info.st_mode), "#05o")
                  evidence["size"] = info.st_size
                  if not stat.S_ISREG(info.st_mode):
                      evidence["error"] = "not a regular file"
                      return evidence
                  if info.st_size > max_size:
                      evidence["error"] = "file exceeds capture hash limit"
                      return evidence
                  digest = hashlib.sha256()
                  with open(path, "rb") as source:
                      for block in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(block)
                  evidence["sha256"] = digest.hexdigest()
              except OSError as error:
                  evidence["error"] = str(error)
                  return evidence
              owner, owner_error = command("dpkg-query", "-S", path)
              if owner_error:
                  evidence["dpkg_owner_error"] = owner_error
              else:
                  evidence["dpkg_owner"] = owner.strip()[:1024]
              return evidence

          def disk_evidence(path):
              if not path:
                  return None
              output, error = command("qemu-img", "info", "-U", "--output=json", path)
              if error:
                  return {"path": path, "error": error}
              try:
                  image = json.loads(output)
              except json.JSONDecodeError as error:
                  return {"path": path, "error": f"invalid qemu-img JSON: {error}"}
              return {
                  "path": path,
                  "format": image.get("format"),
                  "virtual_size": image.get("virtual-size"),
                  "actual_size": image.get("actual-size"),
                  "backing_filename": image.get("backing-filename"),
                  "backing_format": image.get("backing-filename-format"),
                  "full_backing_filename": image.get("full-backing-filename"),
              }

          def matching_firmware_descriptors(loader_path):
              if not loader_path:
                  return []
              selected = os.path.realpath(loader_path)
              matches = []
              for descriptor in sorted(glob("/usr/share/qemu/firmware/*.json")):
                  try:
                      if os.path.getsize(descriptor) > 64 * 1024:
                          continue
                      with open(descriptor, encoding="utf-8") as source:
                          document = json.load(source)
                      executable = document.get("mapping", {}).get("executable", {}).get("filename")
                      if executable and os.path.realpath(executable) == selected:
                          matches.append({
                              "filename": os.path.basename(descriptor),
                              "features": document.get("features", []),
                              "executable": executable,
                          })
                  except (OSError, json.JSONDecodeError):
                      continue
              return matches

          def write(name, data):
              with open(os.path.join(output_dir, name), "w", encoding="utf-8") as destination:
                  json.dump(data, destination, indent=2, sort_keys=True)
                  destination.write("\n")

          names, error = command("virsh", "--connect", uri, "list", "--all", "--name")
          if error:
              write("firmware-capture-index.json", {"error": error})
              raise SystemExit(0)
          domains = [name for name in names.splitlines() if domain_pattern.fullmatch(name)]
          index = {"domains": domains}
          if len(domains) != 1:
              index["capture_state"] = "rejected"
              index["error"] = "expected exactly one bootc-tmt domain"
          write("firmware-capture-index.json", index)
          if len(domains) != 1:
              raise SystemExit(0)

          for name in domains:
              data = {"name": name}
              state, error = command("virsh", "--connect", uri, "domstate", "--reason", name)
              data["domstate_reason"] = state.strip() if state else None
              if error:
                  data["domstate_error"] = error
              xml, error = command("virsh", "--connect", uri, "dumpxml", "--inactive", name)
              if error:
                  data["dumpxml_error"] = error
                  write(f"firmware-{name}.json", data)
                  continue
              try:
                  root = ET.fromstring(xml)
              except ET.ParseError as error:
                  data["dumpxml_error"] = f"XML parse error: {error}"
                  write(f"firmware-{name}.json", data)
                  continue

              os_node = root.find("./os")
              loader = os_node.find("./loader") if os_node is not None else None
              nvram = os_node.find("./nvram") if os_node is not None else None
              disks = []
              for disk in root.findall("./devices/disk"):
                  source = disk.find("./source")
                  source_path = source.get("file") if source is not None else None
                  disks.append({
                      "attributes": dict(sorted(disk.attrib.items())),
                      "driver": element(disk.find("./driver")),
                      "source": element(source),
                      "target": element(disk.find("./target")),
                      "boot": element(disk.find("./boot")),
                      "qemu_image": disk_evidence(source_path),
                  })
              interfaces = []
              for interface in root.findall("./devices/interface"):
                  interfaces.append({
                      "attributes": dict(sorted(interface.attrib.items())),
                      "mac": element(interface.find("./mac")),
                      "model": element(interface.find("./model")),
                      "source": element(interface.find("./source")),
                      "target": element(interface.find("./target")),
                  })
              consoles = []
              for device in root.findall("./devices/serial") + root.findall("./devices/console"):
                  source = device.find("./source")
                  consoles.append({
                      "kind": device.tag,
                      "attributes": dict(sorted(device.attrib.items())),
                      "source": element(source),
                      "target": element(device.find("./target")),
                  })
              firmware_features = []
              if os_node is not None:
                  for feature in os_node.findall("./firmware/*"):
                      firmware_features.append({"name": feature.tag, "attributes": dict(sorted(feature.attrib.items()))})
              loader_path = loader.text.strip() if loader is not None and loader.text else None
              nvram_path = nvram.text.strip() if nvram is not None and nvram.text else None
              nvram_source = nvram.find("./source") if nvram is not None else None
              if not nvram_path and nvram_source is not None:
                  nvram_path = nvram_source.get("file")
              stateless = loader is not None and loader.get("stateless") == "yes"
              descriptors = matching_firmware_descriptors(loader_path)
              capture_errors = []
              if not loader_path:
                  capture_errors.append("missing resolved firmware loader path")
              if not nvram_path and not stateless:
                  capture_errors.append("missing resolved NVRAM path")
              if loader_path and not descriptors:
                  capture_errors.append("no packaged firmware descriptor matches the selected loader")
              data.update({
                  "memory": element(root.find("./memory")),
                  "os": {
                      "attributes": dict(sorted(os_node.attrib.items())) if os_node is not None else {},
                      "type": element(os_node.find("./type")) if os_node is not None else None,
                      "firmware_features": firmware_features,
                      "loader": element(loader),
                      "nvram": element(nvram),
                      "nvram_source": element(nvram_source),
                      "boot": [element(boot) for boot in os_node.findall("./boot")] if os_node is not None else [],
                  },
                  "domain_smm": element(root.find("./features/smm")),
                  "emulator": element(root.find("./devices/emulator")),
                  "disks": disks,
                  "interfaces": interfaces,
                  "serial_consoles": consoles,
                  "firmware_descriptors": descriptors,
                  "resolved_files": {
                      "loader": file_evidence(loader_path, 8 * 1024 * 1024),
                      "nvram": file_evidence(nvram_path, 16 * 1024 * 1024),
                      "nvram_template": file_evidence(nvram.get("template") if nvram is not None else None, 16 * 1024 * 1024),
                  },
                  "capture_state": "complete" if not capture_errors else "incomplete",
                  "capture_errors": capture_errors,
              })
              write(f"firmware-{name}.json", data)
          PY

      - name: Capture Upterm session state
        if: always()
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/reproduction-diagnostics"
          install -d -m 700 "$diagnostics"
          upterm_tmp=$(node -p 'require("os").tmpdir()')
          shopt -s nullglob
          sockets=("$upterm_tmp"/upterm-data/runtime/upterm/*.sock)
          {
            if [[ "${#sockets[@]}" -ne 1 ]]; then
              printf '%s\n' 'Upterm admin socket unavailable.'
            else
              upterm session current --admin-socket "${sockets[0]}" 2>&1 |
                grep -oE 'SHA256:[A-Za-z0-9+/=]+' | sort -u || true
            fi
          } > "$diagnostics/upterm-session-state.txt"

      - name: Archive safe diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: root-transient-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/reproduction-diagnostics/*.txt
            ${{ runner.temp }}/reproduction-diagnostics/*.json
            /var/tmp/tmt/**/*.log
            /var/tmp/tmt/**/output.txt
            /var/tmp/tmt/**/console.txt
            /var/tmp/tmt/**/platform-console.txt
            /var/tmp/tmt/**/screenshot*.png
